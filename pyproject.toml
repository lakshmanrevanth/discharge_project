[project]
name = "agentic-system-for-automated-discharge-summariser"
version = "0.1.0"
description = "Agentic AI system for automated hospital discharge summaries (FA5 capstone)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk==0.3.22",
    "agno==2.1.4",
    "aiofiles==24.1.0",
    "faiss-cpu>=1.15.0",
    "fastapi>=0.141.1",
    "fastmcp==2.12.2",
    "fpdf2>=2.8.7",
    "google-adk==1.25.0",
    "gradio==6.5.1",
    "httpx==0.28.1",
    "langchain==0.3.27",
    "langchain-aws==0.2.18",
    "langchain-community>=0.3.31",
    "langchain-text-splitters>=0.3.11",
    "langfuse>=4.14.2",
    "langgraph==0.6.7",
    "litellm==1.80.7",
    "mcp>=1.23.0,<2.0.0",
    "pydantic>=2.13.4",
    "pypdf2==3.0.1",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "sentence-transformers>=5.6.1",
    "starlette>=0.49.1,<1.0.0",
    "streamlit>=1.61.1",
    # Direct pin so uv can force the CPU index (avoids nvidia/CUDA on Linux).
    "torch>=2.8.0",
    "uvicorn==0.35.0",
]

# CPU-only torch for RAG MiniLM — skip huge nvidia/CUDA wheels on Linux/NuvePro.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
# Prefer company pins from Documentation/REQUIREMENTS_REFERENCE.md §10.1 when adding packages.
# Example: uv add a2a-sdk==0.3.22 google-adk==1.25.0 agno==2.1.4 litellm==1.80.7 ...
